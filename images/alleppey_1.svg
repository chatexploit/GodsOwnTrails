<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f5a53"/>
      <stop offset="1" stop-color="#1b7a6d"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0.1"/>
      <feBlend mode="overlay"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <g opacity="0.12"><rect width="100%" height="100%" fill="#ffffff" filter="url(#grain)"/></g>
  <text x="50%" y="48%" font-size="48" fill="#fff" font-family="Inter,Arial" text-anchor="middle">ALLEPPEY 1</text>
  <text x="50%" y="56%" font-size="20" fill="#e6fff8" font-family="Inter,Arial" text-anchor="middle">Local placeholder image — replace with photo.jpg</text>
</svg>